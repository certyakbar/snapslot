<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset SnapSlot Password</title>
    <style>
      .shell {
        width: 100%;
        max-width: 1040px;
        display: grid;
        grid-template-columns: 1fr 0.95fr;
        gap: 24px;
      }

      .hero {
        padding: 44px 40px;
      }

      .hero h1 {
        font-size: clamp(2.5rem, 3.8vw, 3.15rem);
        line-height: 1;
        margin: 16px 0 14px;
        max-width: 12ch;
      }

      .hero p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
        max-width: 33ch;
      }

      .panel {
        padding: 36px;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 30px;
      }

      .subcopy {
        margin: 0 0 22px;
        line-height: 1.5;
        max-width: 33ch;
      }

      .form-stack {
        display: grid;
        gap: 16px;
      }
    </style>
    <link rel="stylesheet" href="/css/snapslot-theme.css" />
  </head>
  <body class="snapslot-auth snapslot-login">
    <main class="page">
      <div class="shell">
        <section class="hero">
          <div class="eyebrow">SnapSlot access</div>
          <h1>Reset your SnapSlot password.</h1>
          <p>
            Enter the business email for your SnapSlot account. If it is registered, a reset link will be sent.
          </p>
        </section>

        <section class="panel">
          <h2>Password reset</h2>
          <p class="subcopy">Use the business email created when you set up SnapSlot.</p>

          <form id="reset-request-form" class="form-stack" novalidate>
            <div>
              <label for="email">Business email</label>
              <input id="email" name="email" type="email" maxlength="120" autocomplete="username" required />
            </div>

            <button id="submit-button" class="primary-button" type="submit">Send reset link</button>
            <div id="form-message" class="message" aria-live="polite"></div>
          </form>

          <div class="footer-note">
            Remembered it? <a href="/login">Sign in</a>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/js/reset-request.js"></script>
  </body>
</html>
