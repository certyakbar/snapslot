<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose New SnapSlot Password</title>
    <style>
      .shell {
        width: 100%;
        max-width: 1040px;
        display: grid;
        grid-template-columns: 1fr 0.95fr;
        gap: 24px;
      }

      .hero {
        padding: 44px 40px;
      }

      .hero h1 {
        font-size: clamp(2.5rem, 3.8vw, 3.15rem);
        line-height: 1;
        margin: 16px 0 14px;
        max-width: 12ch;
      }

      .hero p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
        max-width: 33ch;
      }

      .panel {
        padding: 36px;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 30px;
      }

      .subcopy {
        margin: 0 0 22px;
        line-height: 1.5;
        max-width: 33ch;
      }

      .form-stack {
        display: grid;
        gap: 16px;
      }
    </style>
    <link rel="stylesheet" href="/css/snapslot-theme.css" />
  </head>
  <body class="snapslot-auth snapslot-login">
    <main class="page">
      <div class="shell">
        <section class="hero">
          <div class="eyebrow">SnapSlot access</div>
          <h1>Choose a new password.</h1>
          <p>
            Use a new password for the business owner account. This will sign out active dashboard sessions.
          </p>
        </section>

        <section class="panel">
          <h2>New password</h2>
          <p class="subcopy">Enter and confirm a new password for your SnapSlot business account.</p>

          <form id="reset-password-form" class="form-stack" novalidate>
            <div>
              <label for="new-password">New password</label>
              <input
                id="new-password"
                name="newPassword"
                type="password"
                minlength="8"
                maxlength="120"
                autocomplete="new-password"
                required
              />
            </div>

            <div>
              <label for="confirm-password">Confirm password</label>
              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                minlength="8"
                maxlength="120"
                autocomplete="new-password"
                required
              />
            </div>

            <button id="submit-button" class="primary-button" type="submit">Update password</button>
            <div id="form-message" class="message" aria-live="polite"></div>
          </form>

          <div class="footer-note">
            Back to <a href="/login">sign in</a>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/js/reset-password.js"></script>
  </body>
</html>
