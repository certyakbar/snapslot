name: PR Sentinel

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  # Governor verdict comments trigger the governor-manifest-commit job, which
  # posts scoped approval state for APPROVE verdicts or refreshes Sentinel for
  # BLOCK verdicts, then produces a genuine pull_request synchronize event.
  # Top-level PR conversation comments are issue_comment events in GitHub's API.
  # The governor-manifest-commit job restricts execution to PR comments that
  # contain 'GOVERNOR VERDICT', so ordinary review discussion is ignored.
  issue_comment:
    types: [created]

permissions:
  contents: write  # required: governor-manifest-commit calls git.createCommit + git.updateRef
  pull-requests: write
  issues: write

concurrency:
  # Separate concurrency groups by event type so that a governor-manifest-commit
  # trigger does not cancel an in-progress pull_request sentinel run.
  # Within each event type, deduplicate by PR number.
  group: sentinel-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run validation
    # Only run for pull_request events.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-validate.yml

  sentinel-judge:
    name: Sentinel verdict
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs only for pull_request events — including the synchronize event produced
    # by governor-manifest-commit when a Governor verdict comment is posted.
    # always() ensures this job runs even when validate fails (to post SENTINEL-FAIL).
    if: always() && github.event_name == 'pull_request'
    env:
      TYPECHECK_PASSED: ${{ needs.validate.outputs.typecheck-passed }}
      TESTS_PASSED: ${{ needs.validate.outputs.tests-passed }}
      VALIDATE_RESULT: ${{ needs.validate.result }}

    steps:
      # ── Sentinel evaluation — pull_request events only ────────────────────
      - name: Evaluate PR and post sentinel verdict
        uses: actions/github-script@v7
        with:
          script: |
            // ── Governor identity ──────────────────────────────────────────
            // Only verdict comments from this GitHub login are accepted.
            // c.user.login is controlled by GitHub and cannot be spoofed.
            const GOVERNOR_LOGIN = 'certyakbar';
            const SCOPED_APPROVAL_COMMENT_AUTHOR_LOGINS = [
              'github-actions[bot]',
              'snapslot-governor[bot]',
            ];
            const USE_SCOPED_APPROVAL_AUTHORITY = true;
            const MANIFEST_IS_NON_AUTHORITATIVE = true;
            const REJECT_DIAGNOSTIC_ONLY_AUTHORITY = true;
            const SCOPED_APPROVAL_CONTROLS_GOVERNOR_PASSED = true;
            const GLOBAL_MANIFEST_NO_LONGER_CONTROLS_GOVERNOR_PASSED = true;

            // ── Validation results ─────────────────────────────────────────
            // Always from the reusable validate job outputs (pull_request path only).
            const typecheckPassed = process.env.TYPECHECK_PASSED === 'true';
            const testsPassed     = process.env.TESTS_PASSED === 'true';
            const validatePassed  = process.env.VALIDATE_RESULT === 'success';

            // ── PR body ────────────────────────────────────────────────────
            const prBody = context.payload.pull_request?.body || '';

            // ── Group B: PR template field checks ─────────────────────────
            function getSentinelAnchor(key) {
              const escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = prBody.match(new RegExp(`<!--\\s*SENTINEL:${escapedKey}=([^\\s>]+)\\s*-->`, 'i'));
              return match ? match[1].trim() : null;
            }

            function getSentinelSection(beginMarker, endMarker) {
              const escapedBegin = beginMarker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const escapedEnd = endMarker.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = prBody.match(
                new RegExp(
                  `<!--\\s*SENTINEL:${escapedBegin}\\s*-->\\s*([\\s\\S]*?)\\s*<!--\\s*SENTINEL:${escapedEnd}\\s*-->`,
                  'i'
                )
              );
              return match ? match[1] : '';
            }

            // B1: Task packet ID — prefer machine-readable anchor, fall back to visible field
            const anchoredTaskId = getSentinelAnchor('task_id');
            const hasTaskId = anchoredTaskId !== null
              ? /^T-\S+$/.test(anchoredTaskId)
              : /Task ID:\s*T-\S+/.test(prBody);

            // B2: Risk tier declared — prefer machine-readable anchor, fall back to visible field
            const anchoredRiskLevel = getSentinelAnchor('risk');
            const riskMatch = prBody.match(/Risk level:\s*(CRITICAL|HIGH|MEDIUM|LOW)/i);
            const riskLevel = anchoredRiskLevel !== null
              ? (/^(CRITICAL|HIGH|MEDIUM|LOW)$/i.test(anchoredRiskLevel) ? anchoredRiskLevel.toUpperCase() : null)
              : (riskMatch ? riskMatch[1].toUpperCase() : null);

            // B3: Files changed section — prefer explicit section markers, fall back to markdown heading parsing
            let filesChangedSection = getSentinelSection('FILES_BEGIN', 'FILES_END');
            if (!filesChangedSection) {
              const filesChangedMatch = prBody.match(
                /\*\*Files changed[^*]*\*\*[^\n]*\n([\s\S]*?)(?=\n\*\*Files explicitly|\n---|\n##|$)/i
              );
              filesChangedSection = filesChangedMatch ? filesChangedMatch[1] : '';
            }
            const declaredFiles = [...filesChangedSection.matchAll(/^[-*]\s+`?([^\s`\n<>]+)`?/gm)]
              .map(m => m[1].trim())
              .filter(f => f.length > 0 && !f.startsWith('<!--'));
            const hasFilesChanged = declaredFiles.length > 0;

            // B4: Ledger impact declared — prefer machine-readable anchor, require real data rows when affected
            const anchoredLedger = getSentinelAnchor('ledger');
            let ledgerSection = getSentinelSection('LEDGER_BEGIN', 'LEDGER_END');
            if (!ledgerSection) {
              const ledgerSectionMatch = prBody.match(/## Ledger impact([\s\S]*?)(?=\n---|\n##|$)/i);
              ledgerSection = ledgerSectionMatch ? ledgerSectionMatch[1] : '';
            }
            const ledgerTableLines = ledgerSection
              .split('\n')
              .map(line => line.trim())
              .filter(line => line.startsWith('|'));
            const ledgerHasRealRows =
              ledgerTableLines.length >= 3 &&
              !ledgerSection.includes('<!-- area -->');
            const ledgerHasContent = anchoredLedger
              ? (
                  anchoredLedger.toUpperCase() === 'NONE'
                    ? /(^|\n)\s*None\s*($|\n)/i.test(ledgerSection)
                    : anchoredLedger.toUpperCase() === 'AFFECTED' && ledgerHasRealRows
                )
              : (
                  /None/i.test(ledgerSection) ||
                  (ledgerSection.includes('|') && !ledgerSection.includes('<!-- area -->'))
                );

            // ── Group C: Protected-path / risk alignment ────────────────────
            // context.issue.number resolves to the PR number for pull_request events.
            let changedFiles = [];
            let fileFetchFailed = false;
            try {
              let page = 1;
              while (true) {
                const { data: files } = await github.rest.pulls.listFiles({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                  page,
                });
                changedFiles.push(...files.map(f => f.filename));
                if (files.length < 100) break;
                page++;
              }
            } catch (e) {
              core.warning(`Could not fetch changed files: ${e.message}`);
              fileFetchFailed = true;
            }

            // CRITICAL-path files (per docs/SNAPSLOT_RISK_POLICY.md §4)
            const criticalPaths = [
              'auth.ts', 'server.ts', 'bookingStore.ts',
              'bookingCore.ts', 'Persistence.ts', 'errors.ts',
            ];

            // HIGH-path files: runtime HIGH files + governance control spine.
            // Governance spine files are HIGH because weakening them degrades the entire
            // enforcement model and requires Governor verdict before merge.
            const highPaths = [
              // Runtime HIGH
              'notificationService.ts',
              'public/js/booking-ui.js',
              'public/js/admin-ui.js',
              'public/js/api.js',
              // Governance control spine (HIGH)
              'CLAUDE.md',
              'AGENTS.md',
              'docs/SNAPSLOT_CONSTITUTION.md',
              'docs/SNAPSLOT_SENTINEL_CONTRACT.md',
              'docs/SNAPSLOT_RISK_POLICY.md',
              'docs/SNAPSLOT_TASK_PACKET_SCHEMA.md',
              '.github/CODEOWNERS',
              '.github/pull_request_template.md',
            ];
            // All files under .github/workflows/ are HIGH (prefix match)
            const highPathPrefixes = ['.github/workflows/'];

            const touchedCritical = changedFiles.filter(f => criticalPaths.includes(f));
            const touchedHigh = changedFiles.filter(f =>
              highPaths.includes(f) ||
              highPathPrefixes.some(prefix => f.startsWith(prefix))
            );

            // Fail closed if the file fetch failed — do not silently pass
            let riskAlignmentPassed = !fileFetchFailed;
            let riskAlignmentNote = fileFetchFailed
              ? 'Changed-files API call failed — failing closed; cannot verify risk alignment'
              : 'No protected-path risk mismatch';

            if (!fileFetchFailed) {
              if (touchedCritical.length > 0 && riskLevel !== 'CRITICAL') {
                riskAlignmentPassed = false;
                riskAlignmentNote =
                  `CRITICAL-path files changed (\`${touchedCritical.join('`, `')}\`) ` +
                  `but risk declared as \`${riskLevel || 'MISSING'}\`. Must be CRITICAL.`;
              } else if (
                touchedCritical.length === 0 &&
                touchedHigh.length > 0 &&
                riskLevel &&
                !['CRITICAL', 'HIGH'].includes(riskLevel)
              ) {
                riskAlignmentPassed = false;
                riskAlignmentNote =
                  `HIGH-path files changed (\`${touchedHigh.join('`, `')}\`) ` +
                  `but risk declared as \`${riskLevel}\`. Must be CRITICAL or HIGH.`;
              } else if (touchedCritical.length > 0 || touchedHigh.length > 0) {
                riskAlignmentNote =
                  `Protected files changed: \`${[...touchedCritical, ...touchedHigh].join('`, `')}\`` +
                  ` — risk level \`${riskLevel}\` is aligned.`;
              }
            }

            // C3: Declared scope vs actual diff — EXACT equivalence required in both directions.
            // (1) Files in the actual diff but not declared → scope-drift violation.
            // (2) Files declared but not in the actual diff → phantom-scope violation.
            // Both directions must match. A declared file that was never changed is as wrong
            // as an undeclared file that was changed.
            //
            // ops/GOVERNOR_APPROVAL.json is excluded from scope comparison in C3 and Group D.
            // This file is committed automatically by the Governor App (or manually during
            // bootstrap) and is not part of the developer's declared scope in the PR body.
            const MANIFEST_PATH       = 'ops/GOVERNOR_APPROVAL.json';
            const changedFilesForScope = !fileFetchFailed
              ? changedFiles.filter(f => f !== MANIFEST_PATH)
              : [];

            let scopeAlignmentPassed = true;
            let scopeAlignmentNote = 'Scope check skipped (declared files not parsed from body)';

            if (fileFetchFailed) {
              scopeAlignmentPassed = false;
              scopeAlignmentNote =
                'File fetch failed — scope check cannot be completed, failing closed';
            } else if (hasFilesChanged) {
              const undeclaredFiles = changedFilesForScope.filter(f => !declaredFiles.includes(f));
              const phantomFiles    = declaredFiles.filter(f => !changedFilesForScope.includes(f));

              if (undeclaredFiles.length > 0 || phantomFiles.length > 0) {
                scopeAlignmentPassed = false;
                const parts = [];
                if (undeclaredFiles.length > 0) {
                  parts.push(
                    `Files in diff but not declared: \`${undeclaredFiles.join('`, `')}\``
                  );
                }
                if (phantomFiles.length > 0) {
                  parts.push(
                    `Files declared but not in diff: \`${phantomFiles.join('`, `')}\``
                  );
                }
                scopeAlignmentNote = parts.join('; ');
              } else {
                const manifestExcluded = changedFiles.includes(MANIFEST_PATH);
                scopeAlignmentNote =
                  `Declared scope exactly matches actual diff (${changedFilesForScope.length} file(s)` +
                  (manifestExcluded ? ` — \`${MANIFEST_PATH}\` excluded` : '') + ')';
              }
            }
            // If !hasFilesChanged, B3 already fails the PR; scope check note stays as-is.

            // ── Group D: Governor verdict ──────────────────────────────────
            //
            // APPROVE source of truth: scoped approval comments are authoritative.
            //   ops/GOVERNOR_APPROVAL.json is retained for write/reset compatibility,
            //   but parsedManifest no longer controls governorPassed.
            //   authority: authoritative
            //   authority must not be diagnostic_only
            //
            // BLOCK verdict: comment-based (conservative — a stale BLOCK is safe; never approves).
            //   A BLOCK comment from @GOVERNOR_LOGIN posted at or after the scoped approval
            //   issued_at overrides approval. Equal timestamp fails closed.
            //
            // CRITICAL/HIGH: valid scoped approval comment required; BLOCK always overrides.
            // MEDIUM/LOW:    no scoped approval required; BLOCK still enforced at all risk levels.
            //
            // Fail closed: any API error in scoped approval fetch or BLOCK scan = governorPassed false.

            const governorCheckApplies = !!(riskLevel && ['CRITICAL', 'HIGH'].includes(riskLevel));
            let governorPassed = !governorCheckApplies; // default: pass for MEDIUM/LOW
            let governorNote   = governorCheckApplies
              ? `Risk level \`${riskLevel}\` requires a valid authoritative scoped approval comment`
              : `Not required for risk level \`${riskLevel || 'undeclared'}\``;

            let parsedManifest   = null;
            let latestBlockCreatedAt = null;
            let scopedApprovalAuthorityNote = 'No scoped approval artifact evaluated';
            let scopedApprovalIssuedAt = null;
            let SCOPED_APPROVAL_AUTHORITY_PASSED = false;
            const SCOPED_APPROVAL_BEGIN = 'SNAPSLOT_SCOPED_APPROVAL_STATE_BEGIN';
            const SCOPED_APPROVAL_END = 'SNAPSLOT_SCOPED_APPROVAL_STATE_END';

            // ── Step D1: Read retained approval manifest from PR HEAD ───────
            // parsedManifest no longer controls governorPassed; retained for write/reset compatibility.
            try {
              let rawManifest = null;
              try {
                const { data: fileResp } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  path:  MANIFEST_PATH,
                  ref:   context.payload.pull_request.head.sha,
                });
                rawManifest = Buffer.from(fileResp.content, 'base64').toString('utf8');
              } catch (fetchErr) {
                if (fetchErr.status !== 404) throw fetchErr;
              }

              if (rawManifest !== null) {
                try {
                  parsedManifest = JSON.parse(rawManifest);
                } catch (_) {
                  parsedManifest = null;
                }
              }
            } catch (e) {
              core.warning(`Retained approval manifest read failed: ${e.message}`);
              if (governorCheckApplies) {
                governorPassed = false;
                governorNote = `Retained approval manifest read failed — failing closed: ${e.message}`;
              }
            }

            function stripScopedApprovalCodeFences(artifactText) {
              return artifactText
                .trim()
                .replace(/^```(?:json)?[ \t]*\r?\n?/i, '')
                .replace(/\r?\n?```$/i, '')
                .trim();
            }

            function extractScopedApprovalArtifact(commentBody) {
              const beginIndex = commentBody.indexOf(SCOPED_APPROVAL_BEGIN);
              if (beginIndex === -1) return null;
              const artifactStart = beginIndex + SCOPED_APPROVAL_BEGIN.length;
              const endIndex = commentBody.indexOf(SCOPED_APPROVAL_END, artifactStart);
              if (endIndex === -1) return null;
              return commentBody.slice(artifactStart, endIndex);
            }

            async function collectScopedApprovalComments() {
              // REQUIRE_SCOPED_APPROVAL_NATIVE_PAGINATION
              const scopedApprovalPagination = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              return scopedApprovalPagination;
            }

            function compareExactScope(artifactScope) {
              const scopedFiles = (Array.isArray(artifactScope) ? artifactScope : [])
                .filter(f => f !== MANIFEST_PATH);
              const undeclared = changedFilesForScope.filter(f => !scopedFiles.includes(f));
              const phantom = scopedFiles.filter(f => !changedFilesForScope.includes(f));
              return { passed: undeclared.length === 0 && phantom.length === 0, undeclared, phantom };
            }

            // ── Step D2: Scoped approval authority validation ──────────────
            try {
              if (SCOPED_APPROVAL_COMMENT_AUTHOR_LOGINS.length === 0) {
                throw new Error('SCOPED_APPROVAL_COMMENT_AUTHOR_LOGINS is empty');
              }

              const allScopedApprovalComments = await collectScopedApprovalComments();
              const scopedApprovalArtifacts = [];

              for (const comment of allScopedApprovalComments) {
                const artifactText = extractScopedApprovalArtifact(comment.body || '');
                if (!artifactText) continue;
                const commentAuthor = comment.user?.login;
                if (!SCOPED_APPROVAL_COMMENT_AUTHOR_LOGINS.includes(commentAuthor)) continue;
                scopedApprovalArtifacts.push({ comment, artifactText });
              }

              scopedApprovalArtifacts.sort((a, b) =>
                new Date(a.comment.created_at).getTime() - new Date(b.comment.created_at).getTime()
              );

              const latestScopedApproval = scopedApprovalArtifacts[scopedApprovalArtifacts.length - 1] || null;
              if (!latestScopedApproval) {
                scopedApprovalAuthorityNote = 'No scoped approval comment artifact found';
              } else {
                let artifact = null;
                const authorityIssues = [];
                const commentAuthor = latestScopedApproval.comment.user?.login;

                // REQUIRE_SCOPED_APPROVAL_BOT_AUTHOR
                if (!SCOPED_APPROVAL_COMMENT_AUTHOR_LOGINS.includes(commentAuthor)) {
                  authorityIssues.push(`comment author \`${commentAuthor || 'missing'}\` is not an accepted scoped approval bot`);
                }

                try {
                  artifact = JSON.parse(stripScopedApprovalCodeFences(latestScopedApproval.artifactText));
                } catch (_) {
                  authorityIssues.push('scoped approval artifact is malformed JSON');
                }

                if (!artifact || typeof artifact !== 'object') {
                  authorityIssues.push('scoped approval artifact must be a JSON object');
                } else {
                  if (artifact.authority !== 'authoritative') {
                    authorityIssues.push('authority must not be diagnostic_only');
                  }
                  if (artifact.pr_number !== context.issue.number) {
                    authorityIssues.push('pr_number mismatch');
                  }
                  // REQUIRE_SCOPED_APPROVAL_GOVERNOR_LOGIN_MATCH
                  if (artifact.governor_login !== GOVERNOR_LOGIN) {
                    authorityIssues.push('governor_login mismatch');
                  }
                  if (artifact.risk_tier !== riskLevel) {
                    authorityIssues.push('risk_tier mismatch');
                  }
                  if (artifact.task_id !== anchoredTaskId) {
                    authorityIssues.push('task_id mismatch');
                  }
                  if (artifact.ledger_state !== anchoredLedger) {
                    authorityIssues.push('ledger_state mismatch');
                  }
                  const scopeComparison = compareExactScope(artifact.declared_files);
                  if (!scopeComparison.passed) {
                    if (scopeComparison.undeclared.length > 0) {
                      authorityIssues.push(`undeclared changed files: \`${scopeComparison.undeclared.join('`, `')}\``);
                    }
                    if (scopeComparison.phantom.length > 0) {
                      authorityIssues.push(`phantom scoped files: \`${scopeComparison.phantom.join('`, `')}\``);
                    }
                  }
                  scopedApprovalIssuedAt = artifact.issued_at ? new Date(artifact.issued_at) : null;
                  if (!scopedApprovalIssuedAt || Number.isNaN(scopedApprovalIssuedAt.getTime())) {
                    authorityIssues.push('issued_at missing or invalid');
                    scopedApprovalIssuedAt = null;
                  }

                  const { data: scopedHeadCommit } = await github.rest.git.getCommit({
                    owner:      context.repo.owner,
                    repo:       context.repo.repo,
                    commit_sha: context.payload.pull_request.head.sha,
                  });
                  if (!scopedHeadCommit.parents || scopedHeadCommit.parents.length === 0) {
                    authorityIssues.push('PR HEAD commit has no parent');
                  } else {
                    const scopedParentSha = scopedHeadCommit.parents[0].sha;
                    const { data: scopedParentCommit } = await github.rest.git.getCommit({
                      owner:      context.repo.owner,
                      repo:       context.repo.repo,
                      commit_sha: scopedParentSha,
                    });
                    if (artifact.approved_parent_sha !== scopedParentSha) {
                      authorityIssues.push('approved_parent_sha mismatch');
                    }
                    if (artifact.approved_tree_sha !== scopedParentCommit.tree.sha) {
                      authorityIssues.push('approved_tree_sha mismatch');
                    }
                  }
                }

                SCOPED_APPROVAL_AUTHORITY_PASSED = authorityIssues.length === 0;
                scopedApprovalAuthorityNote = SCOPED_APPROVAL_AUTHORITY_PASSED
                  ? `Authoritative scoped approval valid (issued ${artifact.issued_at})`
                  : `Authoritative scoped approval invalid: ${authorityIssues.join('; ')}`;
              }

              if (governorCheckApplies) {
                governorPassed = SCOPED_APPROVAL_AUTHORITY_PASSED;
                governorNote = scopedApprovalAuthorityNote;
              }
            } catch (e) {
              core.warning(`Scoped approval authority validation error: ${e.message}`);
              SCOPED_APPROVAL_AUTHORITY_PASSED = false;
              if (governorCheckApplies) {
                governorPassed = false;
                governorNote = `Scoped approval authority validation failed — failing closed: ${e.message}`;
              }
            }

            // ── Step D3: BLOCK comment scan (ALL risk levels) ─────────────
            // A BLOCK from @GOVERNOR_LOGIN overrides approval unless the scoped approval is newer.
            // BLOCK_NEWER_THAN_OR_EQUAL_TO_SCOPED_APPROVAL_FAILS
            try {
              const blockComments = [];
              let bPage = 1;
              while (true) {
                const { data: bComments } = await github.rest.issues.listComments({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                  page: bPage,
                });
                for (const c of bComments) {
                  if (
                    c.user &&
                    c.user.login === GOVERNOR_LOGIN &&
                    /GOVERNOR VERDICT:\s*BLOCK/i.test(c.body || '')
                  ) {
                    blockComments.push(c);
                  }
                }
                if (bComments.length < 100) break;
                bPage++;
              }

              if (blockComments.length > 0) {
                const latestBlock = blockComments[blockComments.length - 1];
                const latestBlockTime = new Date(latestBlock.created_at).getTime();
                const scopedApprovalTime = scopedApprovalIssuedAt ? scopedApprovalIssuedAt.getTime() : 0;
                latestBlockCreatedAt = latestBlock.created_at;

                if (scopedApprovalTime > 0 && scopedApprovalTime > latestBlockTime) {
                  governorNote += ` (supersedes BLOCK from ${latestBlock.created_at})`;
                } else {
                  governorPassed = false;
                  if (governorCheckApplies) {
                    SCOPED_APPROVAL_AUTHORITY_PASSED = false;
                  }
                  governorNote =
                    `Governor BLOCK (${latestBlock.created_at}) — overrides scoped approval at all risk levels` +
                    (blockComments.length > 1 ? ` (latest of ${blockComments.length} BLOCK verdicts)` : '');
                }
              }
            } catch (e) {
              core.warning(`BLOCK comment scan failed: ${e.message}`);
              governorPassed = false;
              governorNote   = `BLOCK comment scan failed — failing closed: ${e.message}`;
            }

            // ── Build check table ────────────────────────────────────────────
            const p = passed => (passed ? '✅ PASS' : '❌ FAIL');

            const rows = [
              ['TypeScript typecheck (`npx tsc --noEmit`)', p(typecheckPassed), ''],
              ['Full test suite (`npm test`)',               p(testsPassed),     ''],
              ['Task packet ID (`T-{...}`)',                 p(hasTaskId),       hasTaskId ? '' : 'Missing or placeholder — fill Task ID field'],
              ['Risk tier declared',                        p(!!riskLevel),     riskLevel ? `\`${riskLevel}\`` : 'Missing — add CRITICAL / HIGH / MEDIUM / LOW'],
              ['Allowed files declaration',                 p(hasFilesChanged), hasFilesChanged ? '' : 'Files changed section appears empty or contains only placeholders'],
              ['Ledger / doc impact declared',              p(ledgerHasContent),ledgerHasContent ? '' : 'Ledger anchor/body mismatch — use SENTINEL:ledger=NONE with exact "None", or SENTINEL:ledger=AFFECTED with at least one real ledger row'],
              ['Protected path / risk alignment',           p(riskAlignmentPassed), riskAlignmentNote],
              ['Declared scope vs actual diff',             p(scopeAlignmentPassed), scopeAlignmentNote],
            ];

            // Governor verdict row label and result vary by situation:
            //   - CRITICAL/HIGH with no valid scoped approval → required, FAIL
            //   - Any risk level with active BLOCK newer than or equal to scoped approval → overrides, FAIL
            //   - MEDIUM/LOW with no BLOCK → N/A
            if (governorCheckApplies || !governorPassed) {
              const label = governorCheckApplies
                ? `Governor verdict (required — risk \`${riskLevel}\`)`
                : 'Governor verdict (BLOCK — overrides at all risk levels)';
              rows.push([label, p(governorPassed), governorNote]);
            } else {
              rows.push(['Governor verdict', '— N/A', governorNote]);
            }

            rows.push([
              'Scoped approval authority',
              governorCheckApplies ? p(SCOPED_APPROVAL_AUTHORITY_PASSED) : '— N/A',
              scopedApprovalAuthorityNote,
            ]);

            // ── Determine overall verdict ─────────────────────────────────
            // governorPassed covers all four cases:
            //   true  — MEDIUM/LOW with no BLOCK, or any level with APPROVE
            //   false — CRITICAL/HIGH with no/BLOCK verdict; any level with BLOCK; API failure
            const allPassed =
              validatePassed &&
              hasTaskId &&
              !!riskLevel &&
              hasFilesChanged &&
              ledgerHasContent &&
              riskAlignmentPassed &&
              scopeAlignmentPassed &&
              governorPassed;

            const verdict = allPassed
              ? '✅ SENTINEL-PASS'
              : '❌ SENTINEL-FAIL';

            // ── Post comment ──────────────────────────────────────────────
            const body = [
              '## Sentinel Report',
              '',
              '| Check | Result | Note |',
              '|---|---|---|',
              ...rows.map(([check, result, note]) =>
                `| ${check} | ${result} | ${note} |`
              ),
              '',
              `**Verdict: ${verdict}**`,
              '',
              allPassed
                ? '> All checks passed. scoped approval comments are authoritative for CRITICAL or HIGH risk changes before merge; ops/GOVERNOR_APPROVAL.json is retained but no longer active approval authority.'
                : '> One or more checks failed. Fix all ❌ items and push again.',
              '',
              '> Governed by `docs/SNAPSLOT_SENTINEL_CONTRACT.md` and `docs/SNAPSLOT_RISK_POLICY.md`.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            if (!allPassed) {
              core.setFailed(`Sentinel checks failed: ${verdict}`);
            }

  # ── Governor manifest-commit trigger ─────────────────────────────────────
  # When the Governor posts "GOVERNOR VERDICT: APPROVE FOR MERGE", this job
  # posts an authoritative scoped approval artifact to the PR and pushes a
  # same-tree synchronize-trigger commit. The artifact records approved_parent_sha
  # (the exact commit SHA being approved) and approved_tree_sha (the Merkle root
  # of the reviewed repository state). sentinel-judge validates the scoped
  # approval artifact on the new SHA:
  #   parent_of_new_HEAD === artifact.approved_parent_sha  →  approval valid
  #   any further commit  →  new parent ≠ approved_parent_sha  →  auto-expired
  #
  # When the Governor posts "GOVERNOR VERDICT: BLOCK", this job pushes an
  # empty commit (same tree) to trigger a synchronize event so sentinel-judge
  # re-evaluates the BLOCK comment. No manifest is created for BLOCK verdicts;
  # BLOCK remains comment-based (conservative — stale BLOCKs are safe).
  #
  # Authentication: the Governor App token signs the commit. The script also
  # checks comment.user.login === GOVERNOR_LOGIN before acting.
  governor-manifest-commit:
    name: Governor verdict synchronize trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == 'certyakbar' &&
      github.event.issue.pull_request.url != '' &&
      contains(github.event.comment.body, 'GOVERNOR VERDICT')

    steps:
      - name: Create Governor App token
        id: governor-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GOVERNOR_APP_ID }}
          private-key: ${{ secrets.GOVERNOR_APP_PRIVATE_KEY }}

      - name: Publish Governor verdict artifact
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.governor-app-token.outputs.token }}
          script: |
            // ── Authentication ─────────────────────────────────────────────
            // Only act on verdicts from the Governor login.
            // comment.user.login is controlled by GitHub and cannot be spoofed.
            const GOVERNOR_LOGIN  = 'certyakbar';
            const MANIFEST_PATH   = 'ops/GOVERNOR_APPROVAL.json';
            const commentBody     = context.payload.comment.body || '';
            const commentAuthor   = context.payload.comment.user?.login;

            if (commentAuthor !== GOVERNOR_LOGIN) {
              core.info(`Comment from ${commentAuthor} — not the Governor; skipping`);
              return;
            }

            // ── Fetch PR details ───────────────────────────────────────────
            const { data: pr } = await github.rest.pulls.get({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.base.ref !== 'main') {
              core.warning(`PR #${pr.number} targets '${pr.base.ref}', not 'main' — skipped`);
              return;
            }

            const headBranch = pr.head.ref;
            const headSha    = pr.head.sha;

            core.info(`PR #${pr.number}: branch=${headBranch} head=${headSha}`);

            const isApprove = /GOVERNOR VERDICT:\s*APPROVE FOR MERGE/i.test(commentBody);
            const isBlock   = /GOVERNOR VERDICT:\s*BLOCK/i.test(commentBody);

            if (isApprove) {
              // ── Build scoped approval state and trigger synchronize ────────
              // Fetch head commit to get tree SHA (= approved_tree_sha)
              const { data: headCommit } = await github.rest.git.getCommit({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                commit_sha: headSha,
              });

              // Parse task_id, risk, declared_files from PR body
              const prBody = pr.body || '';

              function getAnchor(key) {
                const m = prBody.match(
                  new RegExp(
                    `<!--\\s*SENTINEL:${key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}=([^\\s>]+)\\s*-->`,
                    'i'
                  )
                );
                return m ? m[1].trim() : null;
              }
              function getSectionContent(begin, end) {
                const m = prBody.match(
                  new RegExp(
                    `<!--\\s*SENTINEL:${begin}\\s*-->\\s*([\\s\\S]*?)\\s*<!--\\s*SENTINEL:${end}\\s*-->`,
                    'i'
                  )
                );
                return m ? m[1] : '';
              }

              const taskId   = getAnchor('task_id') || 'UNKNOWN';
              const riskTier = getAnchor('risk')    || 'UNKNOWN';
              const ledger   = getAnchor('ledger')  || 'UNKNOWN';
              const filesSection   = getSectionContent('FILES_BEGIN', 'FILES_END');
              const declaredFiles  = [...filesSection.matchAll(/^[-*]\s+`?([^\s`\n<>]+)`?/gm)]
                .map(m => m[1].trim())
                .filter(f => f.length > 0 && !f.startsWith('<!--') && f !== MANIFEST_PATH);

              const scopedApprovalState = {
                schema_version: '1',
                verdict: 'APPROVE',
                governor_login: GOVERNOR_LOGIN,
                pr_number: pr.number,
                approved_parent_sha: headSha,
                approved_tree_sha: headCommit.tree.sha,
                risk_tier: riskTier,
                task_id: taskId,
                declared_files: declaredFiles,
                ledger_state: ledger,
                issued_at: new Date().toISOString(),
                storage_backend: 'github_pr_comment',
                repository_persistent: false,
                authority: 'authoritative',
              };

              const scopedApprovalBody = [
                'SNAPSLOT_SCOPED_APPROVAL_STATE_BEGIN',
                JSON.stringify(scopedApprovalState, null, 2),
                'SNAPSLOT_SCOPED_APPROVAL_STATE_END',
              ].join('\n');

              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: pr.number,
                body:         scopedApprovalBody,
              });

              const { data: newCommit } = await github.rest.git.createCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                message: `chore: refresh sentinel after governor approve ${headSha.slice(0, 7)}`,
                tree: headCommit.tree.sha,
                parents: [headSha],
              });

              // force: false — rejects if branch has advanced since we read headSha
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `heads/${headBranch}`,
                sha:   newCommit.sha,
                force: false,
              });

              core.info(
                `Authoritative scoped approval artifact posted; synchronize-trigger commit ${newCommit.sha} pushed on ${headBranch}`
              );

            } else if (isBlock) {
              // ── BLOCK: push empty commit to trigger synchronize ────────────
              // BLOCK is comment-based; the Sentinel re-reads comments on the new
              // SHA and applies the BLOCK. No manifest is created for BLOCK.
              const { data: headCommit } = await github.rest.git.getCommit({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                commit_sha: headSha,
              });

              const { data: newCommit } = await github.rest.git.createCommit({
                owner:   context.repo.owner,
                repo:    context.repo.repo,
                message: 'chore: refresh sentinel after governor block',
                tree:    headCommit.tree.sha,
                parents: [headSha],
              });

              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `heads/${headBranch}`,
                sha:   newCommit.sha,
                force: false,
              });

              core.info(
                `Empty commit ${newCommit.sha} pushed after BLOCK verdict on ${headBranch}`
              );
            }
