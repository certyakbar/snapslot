name: Post-merge manifest reset

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  reset-governor-manifest:
    name: Reset Governor approval manifest
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create Governor App token
        id: governor-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GOVERNOR_APP_ID }}
          private-key: ${{ secrets.GOVERNOR_APP_PRIVATE_KEY }}

      - name: Reset manifest to canonical NONE
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.governor-app-token.outputs.token }}
          script: |
            try {
              const CANONICAL_NONE = {
                schema_version:      '1',
                verdict:             'NONE',
                governor_login:      null,
                pr_number:           null,
                approved_parent_sha: null,
                approved_tree_sha:   null,
                risk_tier:           null,
                task_id:             null,
                declared_files:      [],
                ledger_state:        null,
                issued_at:           null,
              };

              function isCanonicalNone(m) {
                const keys = Object.keys(CANONICAL_NONE);
                if (!m || typeof m !== 'object' || Array.isArray(m)) return false;
                if (Object.keys(m).length !== keys.length) return false;
                for (const k of keys) {
                  const expected = CANONICAL_NONE[k];
                  const actual   = m[k];
                  if (Array.isArray(expected)) {
                    if (!Array.isArray(actual) || actual.length !== expected.length) return false;
                  } else {
                    if (actual !== expected) return false;
                  }
                }
                return true;
              }

              const manifestPath = 'ops/GOVERNOR_APPROVAL.json';

              const { data: mainRef } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   'heads/main',
              });
              const mainSha = mainRef.object.sha;

              let manifestFile;
              try {
                ({ data: manifestFile } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  path:  manifestPath,
                  ref:   mainSha,
                }));
              } catch (error) {
                if (error.status === 404) {
                  throw new Error('ops/GOVERNOR_APPROVAL.json not found on main HEAD');
                }
                throw error;
              }

              if (!('content' in manifestFile) || typeof manifestFile.content !== 'string') {
                throw new Error(`${manifestPath} content payload missing at main HEAD`);
              }

              let manifest;
              try {
                manifest = JSON.parse(Buffer.from(manifestFile.content, 'base64').toString('utf8'));
              } catch (error) {
                throw new Error(`Malformed JSON in ${manifestPath} at main HEAD: ${error.message}`);
              }

              if (isCanonicalNone(manifest)) {
                core.info('manifest already canonical NONE — no-op');
                return;
              }

              const { data: headCommit } = await github.rest.git.getCommit({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                commit_sha: mainSha,
              });

              const canonicalJson = `${JSON.stringify(CANONICAL_NONE, null, 2)}\n`;

              const { data: blob } = await github.rest.git.createBlob({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                content:  Buffer.from(canonicalJson).toString('base64'),
                encoding: 'base64',
              });

              const { data: tree } = await github.rest.git.createTree({
                owner:     context.repo.owner,
                repo:      context.repo.repo,
                base_tree: headCommit.tree.sha,
                tree: [{
                  path: manifestPath,
                  mode: '100644',
                  type: 'blob',
                  sha:  blob.sha,
                }],
              });

              const prNumber = context.payload.pull_request.number;

              const { data: commit } = await github.rest.git.createCommit({
                owner:   context.repo.owner,
                repo:    context.repo.repo,
                message: `chore: reset governor approval manifest after PR #${prNumber} merge`,
                tree:    tree.sha,
                parents: [mainSha],
              });

              try {
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  ref:   'heads/main',
                  sha:   commit.sha,
                  force: false,
                });
              } catch (error) {
                if (error.status === 403 || error.status === 422) {
                  throw new Error('Branch protection rejected push to main — Governor App may need bypass actor permission in repo branch protection settings. Do NOT retry with force: true.');
                }
                throw error;
              }

              core.info(`Reset manifest commit pushed to main: ${commit.sha}`);
            } catch (error) {
              core.setFailed(error.message);
              throw error;
            }
